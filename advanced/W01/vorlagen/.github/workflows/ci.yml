name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy src
      - name: Lieferungen holen
        run: |
          curl -fsSL --create-dirs -o daten/lieferungen.zip https://raw.githubusercontent.com/juliankunz18/linkit-courses/main/advanced/daten/lieferungen.zip
          curl -fsSL -o daten/nachlieferung.zip https://raw.githubusercontent.com/juliankunz18/linkit-courses/main/advanced/daten/nachlieferung.zip
          uv run python -m zipfile -e daten/lieferungen.zip daten
          uv run python -m zipfile -e daten/nachlieferung.zip daten
      - name: Tabelle für die Kennzahlen
        run: uv run nordwerk import --aus daten
      - run: uv run pytest
