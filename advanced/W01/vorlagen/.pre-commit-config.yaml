# pre-commit: prüft vor jedem Commit nur die Dateien, die du committest.
# Lokale Hooks mit "uv run", damit dieselben Versionen wie in uv.lock gelten.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: unsupported   # früher „system“: pre-commit verwaltet keine Umgebung, das macht uv
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: unsupported
        pass_filenames: false
        types: [python]
